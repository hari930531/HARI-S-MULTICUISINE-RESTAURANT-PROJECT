apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-consumer-deployment
  labels:
    app: payment-consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app: payment-consumer
  template:
    metadata:
      labels:
        app: payment-consumer
    spec:
      containers:
        - name: payment-consumer
          image: "{{ .Values.consumer.image.repository }}:{{ .Values.consumer.image.tag }}"
          imagePullPolicy: {{ .Values.consumer.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: "mysql-headless"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.user }}"
            - name: DB_PASSWORD
              value: "{{ .Values.database.password }}"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:{{ .Values.kafka.servicePort }}"