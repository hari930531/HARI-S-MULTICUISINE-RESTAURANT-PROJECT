# Core API version for Secret resources
apiVersion: v1
# Kind Secret stores sensitive data like passwords safely
kind: Secret
metadata:
  # Name used by Pods to reference this secret
  name: mysql-secret
# Standard key-value format
type: Opaque
data:
  # Base64 encoded value for 'Admin@123' (echo -n "Admin@123" | base64)
  mysql-root-password: QWRtaW5AMTIz
  # Application user password (also 'Admin@123')
  mysql-password: QWRtaW5AMTIz