# Core API version for non-sensitive configurations
apiVersion: v1
# ConfigMap storing Nginx reverse proxy configuration
kind: ConfigMap
metadata:
  name: frontend-config
data:
  nginx.conf: |
    events {}
    http {
      # Include MIME types so browser parses CSS and JS correctly
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      server {
        # Listen for HTTP requests on port 80
        listen 80;
        server_name localhost;

        # Serve static HTML, CSS, JavaScript, and Image assets
        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
          try_files $uri $uri/ /index.html;
        }

        # Forward all /api/ requests directly to internal backend-service
        location /api/ {
          proxy_pass http://backend-service:5000/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }